  market_ticker: "SPY"
  qqq_ticker: "QQQ"
  vix_ticker: "^VIX"
  # Extra symbols to download for context only (not modeled as tradeable).
  context_tickers:
    - "^VIX"

# Legacy 3-class label params (kept for reference / comparison only).
labels:
  horizon_days: 5
  upside_threshold: 0.04
  downside_threshold: -0.04

# Triple-barrier (Stage B) + expansion (Stage A) label params. ATR-scaled so
# thresholds adapt per stock. These are the active labels.
triple_barrier:
  horizon: 10          # vertical (time) barrier in trading days
  tp_atr_mult: 2.0     # profit target = entry + tp_atr_mult * ATR
  sl_atr_mult: 1.0     # stop loss = entry - sl_atr_mult * ATR
  expansion_horizon: 10
  # Stage A now labels SUSTAINED expansion: forward avg true range >= this
  # multiple of current ATR. ~1.3 keeps the label balanced/discriminative (the
  # old "max move >= 1.5*ATR" definition fired on ~90% of bars, so Stage A
  # learned nothing).
  expansion_atr_mult: 1.3

model:
  type: "xgboost"
  test_size: 0.15
  validation_size: 0.15
  random_state: 42
  # Gate on the combined two-stage score (expansion_prob * long_prob). With the
  # discriminative Stage A, expansion_prob caps near ~0.36, so the product lives
  # in a low band (~0.06 median). Fallback gate ~0.12; the optimizer tunes it.
  probability_threshold: 0.55
  # PIVOT: the squeeze->expansion Stage A was anti-predictive at the top decile
  # and the expansion multiply only inverted the long signal. Score is now the
  # single-stage long meta-label probability (P[triple-barrier TP before SL]),
  # driven by cross-sectional relative-strength / low-vol rank features.
  two_stage: false       # single-stage: score = long_prob
  calibrate: true        # wrap the stage in isotonic calibration

# Leakage-free walk-forward evaluation.
walkforward:
  n_splits: 5
  embargo: 5
  holdout_frac: 0.15
  min_train_dates: 504   # ~2 years before the first test block

backtest:
  initial_capital: 10000
  position_size_pct: 0.10      # base fraction; vol-targeting scales within this
  max_position_pct: 0.20       # hard cap per position
  max_total_exposure: 1.0      # cap on summed position fractions
  take_profit_atr_mult: 2.0    # mirrors triple-barrier TP
  stop_loss_atr_mult: 1.0      # mirrors triple-barrier SL
  max_hold_days: 10
  commission_pct: 0.001
  slippage_pct: 0.001
  long_only: true
  vol_target: true             # size by confidence / ATR%
  # Regime gate: only enter while SPY is above its 200d SMA and VIX is below
  # this percentile of its trailing 1y range. Concentrates the long-only edge
  # in benign regimes and removes the bear/panic folds that drag Sharpe down.
  regime_filter: true
  max_vix_pctile: 0.85

# Pivoted, rules-based strategy: regime-gated cross-sectional momentum.
# The ML theses (expansion, single-stage long meta-label) failed the edge gate;
# a direct factor study showed 60-day cross-sectional momentum is the one
# positively-predictive factor in this universe, while low-vol / near-high
# tilts were inverted. Run via scripts/run_momentum_backtest.py.
momentum:
  score_col: "xs_ret60_rank"   # 60-day cross-sectional momentum rank
  top_pctile: 0.90             # hold top-decile momentum names
  hold_days: 20                # ~monthly time-based hold (no TP/SL truncation)
  tp_atr_mult: 100.0           # effectively disabled -> pure time exit
  sl_atr_mult: 100.0           # effectively disabled -> pure time exit
  vol_target: false            # equal-ish weighting (matches factor study)
  position_size_pct: 0.12
  max_position_pct: 0.20
  max_total_exposure: 1.0
  entry_min_rel_volume: 0.0    # no volume filter for momentum entries

scanner:
  min_price: 5
  min_avg_volume: 1000000
  top_n: 25

# Local paper-trading simulator (fake cash, no real orders). Replays the
# deployed momentum strategy over a recent window in the SAME event-driven
# engine used by the backtest, so the paper account behaves identically to what
# was validated. Run via scripts/paper_trade.py.
paper:
  lookback_months: 12          # default recent window to replay
  starting_capital: 10000      # fake cash to start the account with

# Broker execution for forward paper (and, later, live) trading via Alpaca.
# The executor (scripts/execute_alpaca.py) trades the SAME regime-gated momentum
# picks the dashboard shows. Defaults to PAPER and dry-run. Keys come from env
# vars / a gitignored .env (APCA_API_KEY_ID, APCA_API_SECRET_KEY) -- never here.
execution:
  broker: "alpaca"
  paper: true                  # paper account (no real money). Flip with care.
  target_positions: 3          # max concurrent names (the "3 best stocks")
  deploy_fraction: 0.90        # fraction of equity to put to work; rest stays cash
  min_notional: 1.0            # skip buys smaller than this ($)
  hold_days: 20                # time-exit horizon (mirrors momentum.hold_days)

# Backtest-driven hyperparameter optimization.
optimization:
  objective: "sharpe"          # risk-adjusted (per user choice)
  max_drawdown_cap: 0.20       # penalize configs breaching this OOS drawdown
  fold_aggregation: "median"   # score = median across folds (overfit-resistant)
  n_trials: 20                 # each trial retrains every walk-forward fold
  use_optuna: true             # falls back to random search if optuna absent
  search_space:
    max_depth: [3, 7]
    learning_rate: [0.01, 0.15]
    n_estimators: [200, 600]
    min_child_weight: [1, 10]
    subsample: [0.7, 1.0]
    gamma: [0.0, 1.0]
    # Combined-score gate. With the discriminative Stage A (expansion base rate
    # ~17%), expansion_prob caps near ~0.36, so the product expansion_prob*long_prob
    # lives in a low band (~0.06 median, ~0.13 p99). This range brackets the
    # meaningful operating band: ~0.08 trades often, ~0.16 is selective.
    probability_threshold: [0.08, 0.22]
    tp_atr_mult: [1.5, 3.0]
    sl_atr_mult: [0.75, 1.5]
